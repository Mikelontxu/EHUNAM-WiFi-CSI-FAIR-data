services:

    fdp:            # FAIR data point image to serve the ontology, metadata and data files
        image: fairdata/fairdatapoint:1.20.3
        ports:
            - 8080:80
        volumes:
            - ./application.yml:/fdp/application.yml:ro
        environment:
            - SPRING_MONGODB_URI=mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/fdp?authSource=admin
            - FDP_TRIPLE_STORE_USERNAME=${GRAPHDB_USER}
            - FDP_TRIPLE_STORE_PASSWORD=${GRAPHDB_PASSWORD}
            - FDP_JWT_SECRET_KEY=${FDP_JWT_SECRET_KEY}
        depends_on:
            graphdb:
                condition: service_healthy
            mongo:
                condition: service_started
        healthcheck:
            test: wget -qO- http://localhost/actuator/health || exit 1
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s

    fdp-client:     # FAIR Data Point Client image to interact with the FAIR Data Point
        image: fairdata/fairdatapoint-client:latest
        ports:
            - 80:80
        environment:
            - FDP_HOST=fdp
        depends_on:
            fdp:
                condition: service_healthy

    mongo:          # MongoDB image to store the data of the FAIR Data Point (including users)
        image: mongo:7.0
        environment:
            - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER}
            - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
        volumes:
            - ./mongo/data:/data/db

    graphdb:        # GraphDB image to store the metadata of the FAIR Data Point and the RDF data generated from the .mat files
            image: ontotext/graphdb:10.7.6
            ports:
                - 7200:7200
            environment:
                - GDB_JAVA_OPTS=-Dgraphdb.home=/opt/graphdb/home
            volumes:
                - ./graphdb:/opt/graphdb/home
                - ./repo.json:/tmp/repo.json:ro
            entrypoint:
                - bash
                - -c
                - |
                  set -m
                  /opt/graphdb/dist/bin/graphdb &

                  # Basic auth is added: this auth is ignored while security is disabled, and becomes required as soon as security is turned on below
                  #  (e.g. on a container restart after the first successful run).
                  until curl -sf -u "${GRAPHDB_USER}:${GRAPHDB_PASSWORD}" http://localhost:7200/rest/repositories; do
                    echo "Waiting for GraphDB..."
                    sleep 3
                  done

                  if ! curl -sf -u "${GRAPHDB_USER}:${GRAPHDB_PASSWORD}" http://localhost:7200/rest/repositories/fdp > /dev/null; then
                    echo "Creating fdp repository..."
                    curl -u "${GRAPHDB_USER}:${GRAPHDB_PASSWORD}" -X POST http://localhost:7200/rest/repositories \
                        -H "Content-Type: application/json" \
                        -d "@/tmp/repo.json"
                  else
                    echo "Repository fdp already exists, skipping creation."
                  fi

                  # Detect whether security is already enabled by trying an admin endpoint without credentials. 
                  # $$SEC_PROBE is a bash runtime variable (escaped so Compose doesn't try to interpolate it as a compose variable).
                  SEC_PROBE=$$(curl -s -o /dev/null -w "%{http_code}" http://localhost:7200/rest/security/users)

                  if [ "$$SEC_PROBE" = "401" ] || [ "$$SEC_PROBE" = "403" ]; then
                    echo "GraphDB security already enabled, skipping initial user/security setup."
                  else
                    echo "Setting password for GraphDB user '${GRAPHDB_USER}'..."
                    curl -X PUT "http://localhost:7200/rest/security/users/${GRAPHDB_USER}" \
                        -H "Content-Type: application/json" \
                        -d "{\"username\":\"${GRAPHDB_USER}\",\"password\":\"${GRAPHDB_PASSWORD}\",\"grantedAuthorities\":[\"ROLE_ADMIN\"]}"

                    echo "Enabling GraphDB security..."
                    curl -X POST http://localhost:7200/rest/security \
                        -H "Content-Type: application/json" \
                        -d "true"
                  fi

                  # Enable Free Access so the fdp repository can be read without credentials
                  echo "Enabling GraphDB Free Access (read-only) for the fdp repository..."
                  curl -X POST -u "${GRAPHDB_USER}:${GRAPHDB_PASSWORD}" http://localhost:7200/rest/security/free-access \
                      -H "Content-Type: application/json" \
                      -d '{"enabled": true, "authorities": ["READ_REPO_fdp"], "appSettings": {"DEFAULT_SAMEAS": true, "DEFAULT_INFERENCE": true, "EXECUTE_COUNT": true, "IGNORE_SHARED_QUERIES": false}}'

                  fg
            healthcheck:
                test: curl --fail-with-body -u "${GRAPHDB_USER}:${GRAPHDB_PASSWORD}" http://localhost:7200/repositories/fdp/health || exit 1
                interval: 5s

    nginx:       # NGINX image to serve the .mat files, ontology and documentation generated by widoco
            image: nginx:alpine
            ports:
                - 8090:80
            volumes:
                - ../ontology:/usr/share/nginx/html/ontology:ro
                - ../data:/usr/share/nginx/html/data:ro
                - ./nginx-data.conf:/etc/nginx/nginx.conf:ro

    fuji:          # FUJI image for FAIRness validation
        image: ghcr.io/pangaea-data-publisher/fuji:latest
        container_name: fuji
        ports:
            - 1071:1071

    widoco:         # Widoco image for generating ontology documentation
        image: ghcr.io/dgarijo/widoco:latest
        profiles:
            - widoco
        volumes:
            - ../ontology:/ontology
            - ../docs:/docs
        command: >
            -ontFile /ontology/wifi_activity.ttl
            -outFolder /docs
            -lang en-es
            -getOntologyMetadata
            -includeAnnotationProperties
            -webVowl
            -rewriteAll
            -uniteSections