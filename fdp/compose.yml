# compose.yml

services:

    fdp:            # imagen de FAIR Data Point para servir los datos y metadatos FAIR
        image: fairdata/fairdatapoint:1.16
        volumes:
            - ./application.yml:/fdp/application.yml:ro
        depends_on:
            graphdb:
                condition: service_healthy
        healthcheck:
            test: wget -qO- http://localhost:80/actuator/health || exit 1
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s

    fdp-client:     # imagen de FAIR Data Point Client para interactuar con el FAIR Data Point
        image: fairdata/fairdatapoint-client:1.16
        ports:
            - 80:80
        environment:
            - FDP_HOST=fdp
        depends_on:
            fdp:
                condition: service_healthy

    mongo:          # imagen de MongoDB para almacenar los datos de FAIR Data Point (entre ellos los usuarios)
        image: mongo:4.0.12
        ports:
            - 27017:27017
        volumes:
            - ./mongo/data:/data/db

    graphdb:        # imagen de GraphDB para almacenar los metadatos de FAIR Data Point y los datos RDF generados a partir de los archivos .mat
            image: ontotext/graphdb:10.7.6
            ports:
                - 7200:7200
            environment:
                - GDB_JAVA_OPTS=-Dgraphdb.home=/opt/graphdb/home
            volumes:
                - ./graphdb:/opt/graphdb/home
                - ./repo.json:/tmp/repo.json:ro
            entrypoint:
                - bash
                - -c
                - |
                  set -m
                  /opt/graphdb/dist/bin/graphdb &
                  
                  until curl -sf http://localhost:7200/rest/repositories; do
                    echo "Waiting for GraphDB..."
                    sleep 3
                  done
                  
                  if ! curl -sf http://localhost:7200/rest/repositories/fdp > /dev/null; then
                    echo "Creating fdp repository..."
                    curl -X POST http://localhost:7200/rest/repositories \
                        -H "Content-Type: application/json" \
                        -d "@/tmp/repo.json"
                  else
                    echo "Repository fdp already exists, skipping creation."
                  fi
                  
                  fg
            healthcheck:
                test: curl --fail-with-body http://localhost:7200/repositories/fdp/health || exit 1
                interval: 5s

    ontology:       # imagen de NGINX para servir la ontología y la documentación generada por widoco
            image: nginx:alpine
            ports:
                - 8090:80
            volumes:
                - ../ontology:/usr/share/nginx/html:ro

    fuji:          # imagen de FUJI para validación de FAIRness
        image: ghcr.io/pangaea-data-publisher/fuji:latest
        container_name: fuji
        ports:
            - 1071:1071

    widoco:         # imagen de Widoco para generar documentación de la ontología
        image: ghcr.io/dgarijo/widoco:latest
        profiles:
            - widoco
        volumes:
            - ../ontology:/ontology
        command: >
            -ontFile /ontology/wifi_activity.ttl
            -outFolder /ontology/docs
            -lang en-es
            -getOntologyMetadata
            -includeAnnotationProperties
            -webVowl
            -rewriteAll
            -uniteSections