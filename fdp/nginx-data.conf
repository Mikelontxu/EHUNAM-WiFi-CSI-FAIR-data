# nginx-data.conf — serves .mat files, the ontology and  documentation for the FAIR Data Point (FDP) container.
# Used by the "nginx" container.

events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {    
        listen 80;
        server_name _;

        location /ontology/ {
            alias /usr/share/nginx/html/ontology/;
            autoindex on;          # .ttl of the ontology and documentation
            autoindex_exact_size off;
            autoindex_localtime on;
        }

        location /data/ {
            alias /usr/share/nginx/html/data/;
            autoindex on;          # .mat file listing for download
            autoindex_exact_size off;
            autoindex_localtime on;
        }
    }
}